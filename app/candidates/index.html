<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CV Screening App</title>
    <script
        src="https://ui5.sap.com/1.108.0/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-resourceroots='{"cv.screening.candidates": "./"}'
        data-sap-ui-oninit="module:sap/fe/core/AppComponent"
        data-sap-ui-compatVersion="edge"
        data-sap-ui-async="true"
        data-sap-ui-frameOptions="allow"
        data-sap-ui-manifestFirst="true"
    ></script>
</head>
<body class="sapUiBody" id="content">
    <div
        data-sap-ui-component
        data-name="cv.screening.candidates"
        data-id="container"
        data-settings='{"id":"cv.screening.candidates"}'
    ></div>
</body>
</html>
